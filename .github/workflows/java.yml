name: Java

# Parity lane for laya-java. The fixtures under laya-java/fixtures are recorded FROM the Python
# `laya` package, so this runs on every push and pull request with no path filter: a change to
# laya/ that moves what the fixtures capture shows up here rather than as silent drift. Each run
# re-records them from the Python code at that commit and runs the Java tests against the fresh
# copies.
#
# ADVISORY, not blocking, for the same reason the .NET lane is: the Python package is the product
# and laya-java follows it, so a Python-side improvement must not be blocked on a port catching up.
# When this lane goes red the fix is a follow-up port, not a revert of the Python change.

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # transformers probes for TensorFlow at import; when TF is present its abseil runtime can
  # deadlock model construction. Laya is torch-only.
  USE_TF: "0"
  USE_TORCH: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  build:
    # Prefixed, because `dotnet.yml` already has jobs called "build + model-free tests" and
    # "parity (english)": without a prefix the pull request's checks list shows each name twice
    # and a reader cannot tell which lane failed.
    name: jvm build + model-free tests
    runs-on: ubuntu-latest
    continue-on-error: true   # advisory: see the header
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # The model-free families need no checkpoint, so their drift is checked here. The rest are
      # left alone by the generator and reported as unverified; the parity job checks those.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the Python toolchain the fixtures were recorded with
        run: |
          python -m pip install --upgrade pip
          pip install "torch==2.14.0" --index-url https://download.pytorch.org/whl/cpu
          pip install -r laya-dotnet/tools/requirements-regen.txt
      # -Werror is on, so this fails on a warning as well as an error.
      - name: Build (warnings are errors)
        working-directory: laya-java
        run: ./gradlew --no-daemon build -x test

      # Without LAYA_CHECKPOINTS the checkpoint-backed factories abort by assumption and the rest
      # run. `--min-tests` is what stops an aborted suite from looking like a pass.
      - name: Tests that need no model
        working-directory: laya-java
        run: ./gradlew --no-daemon test
      - name: Model-free suite was not vacuous
        if: ${{ !cancelled() }}
        run: >
          python laya-java/scripts/check_test_results.py
          laya-java/laya-java/build/test-results/test --min-tests 80 --allow-aborted

      # LAST, deliberately. This gate and the tests are independent signals -- the tests compare
      # against the COMMITTED fixture, this compares the committed fixture against a fresh
      # recording -- and running it first meant a stale fixture skipped the build and the tests
      # entirely, so the run said nothing about whether the code worked.
      - name: Model-free fixture drift vs. committed
        if: ${{ !cancelled() }}
        run: python laya-java/scripts/gen_fixtures.py --check --only python_json.json
      # The compiled-in Unicode tables are recorded from CPython, so a CPython upgrade that moves
      # them has to show up here rather than as a routing change nobody attributed.
      - name: Unicode tables match CPython
        if: ${{ !cancelled() }}
        run: python laya-java/scripts/gen_unicode_tables.py --check
      - name: Language tables match laya/lang.py
        if: ${{ !cancelled() }}
        run: python laya-java/scripts/gen_language_tables.py --check

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ failure() }}
        with:
          name: java-build-diagnostics
          path: laya-java/laya-java/build/reports

  parity:
    # ONE job, not a per-checkpoint matrix. The .NET lane matrixes over checkpoints because its
    # goldens are per-checkpoint directories; these fixtures are not -- `tokenizer_ids.json`,
    # `sequences.json` and `decode.json` each carry BOTH checkpoints' sections in one document, so
    # a job holding only one of them can never regenerate them and `--strict` fails by
    # construction. That is what happened on the first run of this lane.
    #
    # Only the checkpoint the end-to-end golden was recorded from needs a graph, so the other is
    # fetched without its weights.
    name: jvm parity
    runs-on: ubuntu-latest
    continue-on-error: true   # advisory: see the header
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install the Python toolchain the fixtures were recorded with
        run: |
          python -m pip install --upgrade pip
          pip install "torch==2.14.0" --index-url https://download.pytorch.org/whl/cpu
          pip install -r laya-dotnet/tools/requirements-regen.txt

      # The export is the slow part (download, trace, verify) and depends only on the pinned
      # revision, the exporter and the model definition, so that is the cache key.
      - name: Cache pinned Hugging Face downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub
          key: laya-java-hf-${{ runner.os }}-${{ hashFiles('laya-java/scripts/prepare_checkpoint.py') }}
      - name: Cache the exported graph
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: laya-java/.work/onnx
          key: laya-java-onnx-${{ runner.os }}-${{ hashFiles('scripts/export_onnx.py', 'laya/common.py', 'laya-dotnet/tools/requirements-regen.txt') }}

      # english: tokenizer and config only. The tokenizer and sequence fixtures need it, nothing
      # here traces it, so its weights would be a few gigabytes of nothing.
      - name: Prepare the english checkpoint (no weights, no graph)
        run: python laya-java/scripts/prepare_checkpoint.py --checkpoint english --no-graph
      # multilingual: the checkpoint the end-to-end golden is recorded from, so it needs the graph.
      - name: Prepare the multilingual checkpoint and export its graph
        run: python laya-java/scripts/prepare_checkpoint.py --checkpoint multilingual

      # Re-recorded from the Python code at THIS commit, and `--strict` makes a family this job
      # could not regenerate an error: here, a skip means the download or export failed rather than
      # that the machine has no model.
      - name: Regenerate every fixture from Python
        env:
          LAYA_FIXTURE_CHECKPOINTS: ${{ github.workspace }}/laya-java/.work/checkpoints
          LAYA_ONNX_GRAPH: ${{ github.workspace }}/laya-java/.work/onnx/multilingual/laya.onnx
          LAYA_PREDICT_MODEL: multilingual
        run: python laya-java/scripts/gen_fixtures.py --strict
      # Informational: float noise across platforms is expected in the model-backed family, and the
      # Java test's tolerance is the gate rather than byte equality of the file.
      - name: Fixture drift vs. committed (informational)
        run: |
          git --no-pager diff --stat -- laya-java/fixtures
          git status --short -- laya-java/fixtures

      - name: Run every test against the fresh fixtures
        working-directory: laya-java
        env:
          LAYA_CHECKPOINTS: ${{ github.workspace }}/laya-java/.work/checkpoints
          LAYA_ONNX_GRAPH: ${{ github.workspace }}/laya-java/.work/onnx/multilingual/laya.onnx
        run: ./gradlew --no-daemon test
      # A checkpoint-backed factory that aborts is not a pass. With the checkpoints present nothing
      # may abort, and the floor catches a suite that silently stopped registering its cases.
      - name: No parity test was skipped
        if: ${{ !cancelled() }}
        run: >
          python laya-java/scripts/check_test_results.py
          laya-java/laya-java/build/test-results/test --min-tests 200

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ failure() }}
        with:
          name: java-parity-diagnostics
          path: |
            laya-java/laya-java/build/reports
            laya-java/fixtures
